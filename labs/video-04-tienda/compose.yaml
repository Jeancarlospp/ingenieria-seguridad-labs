name: forma-tienda
services:
  web:
    build: .
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      SECRET_KEY: "clave-local-forma-video04"
    volumes:
      - store_data:/store/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
volumes:
  store_data:
